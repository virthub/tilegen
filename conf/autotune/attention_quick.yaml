# Quick autotune search space (small, for CI / smoke runs).
target: sm_100a
backend: triton
attention:
  batch: 1
  num_heads: 8
  num_kv_heads: 8
  head_dim: 64
  kv_head_dim: 64
  seq_len: 2048
  num_kv_blocks: 256
  page_size: 32
  dtype: bf16
  kv_quant:
    dtype: fp4_e2m1
    granularity: block
    block_size: 16
    scale_dtype: fp8_e4m3
    pack_factor: 2
search_space:
  tile_m: [64, 128]
  tile_n: [64, 128]
  tile_k: [64]
  pipeline_stages: [2, 3]
  swizzle_mode: [NONE, B128]
  num_warps: [4, 8]
objective: min_device_time_us
