name: ascend_950
arch: Huawei Ascend 950
device: ascend
sm: ascend_950
num_sms: 1
max_smem_bytes: 262144
max_registers_per_thread: 255
warp_size: 32
features: [cube, vector, dma, int8, mxfp8, mxfp4, bfloat16]
quant_paths:
  int8: native
  int4: fused_dequant
  fp8: native
  fp4: native
memory_tiers:
  global: GM
  scratchpad: L1 / UB
  compute_input: L0A / L0B
  accumulator: L0C
