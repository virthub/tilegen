# Compile / benchmark config: Llama-3-70B attention workload on H100.
target: sm_90a
backend: tilelang
attention:
  batch: 1
  num_heads: 8
  num_kv_heads: 8
  head_dim: 128
  kv_head_dim: 64
  seq_len: 2048
  num_kv_blocks: 256
  page_size: 32
  dtype: bf16
  causal: true
  kv_quant:
    dtype: fp4_e2m1
    granularity: block
    block_size: 16
    scale_dtype: fp8_e4m3
    pack_factor: 2
