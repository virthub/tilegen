# CI skeleton: CPU-only matrix (the suite's skip-split is designed for this)
# plus a self-hosted GPU job template for the CUDA-gated subset.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    strategy:
      matrix:
        python: ["3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project (runtime + dev)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Install CPU torch (GPU-dependent tests skip)
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the test suite (GPU-gated subset skips)
        run: |
          PYTHONPATH=src uv run --no-sync python -m pytest tests/ -q

  # GPU subset: run on a self-hosted runner with CUDA + triton + tilelang
  # (e.g. eco4).  Enable by registering a runner with the `gpu` label.
  gpu:
    if: false  # opt-in: set to true (or trigger manually) when a runner exists
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          uv venv
          uv pip install -e ".[dev,tilelang]"
      - name: GPU suite
        run: |
          PYTHONPATH=src uv run --no-sync python -m pytest tests/ -q
